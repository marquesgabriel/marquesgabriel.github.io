# Moves the issues a PR closes (via "Closes #123" in the PR body) on the
# project board: "In Progress" when the PR opens/reopens, "Done" when it
# merges. GitHub's native "Closes #N" auto-close only moves issues on the
# built-in project automation when it fires, so this makes the board update
# explicit and works the same whether or not that automation is configured.
#
# Requires the ACTIONS_DEPLOY_ACCESS_TOKEN secret (classic PAT with `repo`
# + `project` scopes) since the default GITHUB_TOKEN can't write to
# user-owned Projects v2. Reuses the same PAT as deploy.yml rather than a
# separate PROJECT_TOKENS secret.

name: Sync project status

on:
  pull_request:
    types: [opened, reopened, closed]

jobs:
  sync-status:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    steps:
      - name: Move linked issues on the board
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ACTIONS_DEPLOY_ACCESS_TOKEN }}
          script: |
            const PROJECT_OWNER = "marquesgabriel";
            const PROJECT_NUMBER = 2;
            const TARGET_STATUS = context.payload.action === "closed" ? "Done" : "In Progress";

            const body = context.payload.pull_request.body || "";
            const closesRegex = /\b(close[sd]?|fix(?:es|ed)?|resolve[sd]?)\s*:?\s*#(\d+)/gi;
            const issueNumbers = [...body.matchAll(closesRegex)].map(m => parseInt(m[2], 10));

            if (issueNumbers.length === 0) {
              console.log("No 'Closes #N' references found in PR body — nothing to do.");
              return;
            }
            console.log(`Issues referenced: ${issueNumbers.join(", ")} -> ${TARGET_STATUS}`);

            const projectQuery = `
              query($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    field(name: "Status") {
                      ... on ProjectV2SingleSelectField {
                        id
                        options { id name }
                      }
                    }
                    items(first: 100) {
                      nodes {
                        id
                        content {
                          ... on Issue { number }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(projectQuery, {
              owner: PROJECT_OWNER,
              number: PROJECT_NUMBER,
            });

            const project = result.user.projectV2;
            const statusField = project.field;
            const targetOption = statusField.options.find(o => o.name === TARGET_STATUS);

            if (!targetOption) {
              throw new Error(`Status option "${TARGET_STATUS}" not found on the project.`);
            }

            const mutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }
            `;

            for (const issueNumber of issueNumbers) {
              const item = project.items.nodes.find(
                n => n.content && n.content.number === issueNumber
              );
              if (!item) {
                console.log(`Issue #${issueNumber} not found on the project board — skipping.`);
                continue;
              }
              await github.graphql(mutation, {
                projectId: project.id,
                itemId: item.id,
                fieldId: statusField.id,
                optionId: targetOption.id,
              });
              console.log(`Moved issue #${issueNumber} to "${TARGET_STATUS}".`);
            }
